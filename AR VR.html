<!DOCTYPE html>
<html>
  <head>
    <title>Enscape 360 Architecture Tour</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
      // Custom A-Frame component to handle room switching
      AFRAME.registerComponent('hotspot', {
        schema: { targetRoom: {type: 'string'} },
        init: function () {
          let el = this.el;
          let data = this.data;
          
          // UX Feedback: Scale up when hovered
          el.addEventListener('mouseenter', function () {
            el.setAttribute('scale', '1.2 1.2 1.2');
          });
          // UX Feedback: Return to normal when raycaster leaves
          el.addEventListener('mouseleave', function () {
            el.setAttribute('scale', '1 1 1');
          });
          
          // Action: Change the 360 image on click
          el.addEventListener('click', function () {
            document.querySelector('#main-sky').setAttribute('src', data.targetRoom);
          });
        }
      });
    </script>
  </head>
  <body>
    <!-- Setup scene and allow mouse testing on PC before using VR headset -->
    <a-scene cursor="rayOrigin: mouse">
      
      <!-- Preload Enscape Panoramas -->
      <a-assets>
        <!-- Ensure you upload your exported JPGs to this relative path -->
        <img id="livingRoom" src="assets/panoramas/living_room.jpg">
        <img id="kitchen" src="assets/panoramas/kitchen.jpg">
      </a-assets>

      <!-- The 360 Panorama Sphere -->
      <a-sky id="main-sky" src="#livingRoom"></a-sky>

      <!-- Meta Quest Controllers with Laser Pointers -->
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
      
      <!-- Camera locked at standard human height -->
      <a-camera position="0 1.6 0"></a-camera>

      <!-- Interactive Waypoint to move to the Kitchen -->
      <a-sphere class="clickable" color="#4CC3D9" radius="0.2" position="2 1.6 -4" hotspot="targetRoom: #kitchen"></a-sphere>
      
    </a-scene>
  </body>
</html>
